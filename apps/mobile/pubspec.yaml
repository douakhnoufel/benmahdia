name: benmahdia_mobile
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.7

dependencies:
  camera: ^0.12.0+2
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^11.2.0
  google_mlkit_face_detection: ^0.13.2
  google_mlkit_text_recognition: ^0.15.0
  http: ^1.6.0
  intl: ^0.20.2
  timezone: ^0.11.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/logo.png

# App icon from the clinic logo: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/logo_source.jpg
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF" # AppColors.surface
  adaptive_icon_foreground: assets/brand/logo_padded.png

# Launch screen before Flutter starts: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#063A35" # AppColors.teal900, same as the splash screen
  image: assets/brand/logo_padded.png
  android_12:
    color: "#063A35"
    icon_background_color: "#FFFFFF"
    image: assets/brand/logo_android12.png
